<!DOCTYPE html>
<html lang="fr" class="bg-rich-black text-anti-flash-white antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ERP Sakania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rich-black': '#021B1A',
                        'dark-green': '#032221',
                        'bangladesh-green': '#03624C',
                        'mountain-meadow': '#2CC295',
                        'caribbean-green': '#00DF81',
                        'anti-flash-white': '#F1F7F6',
                        'pine': '#06302B',
                        'mint': '#2FA98C',
                        'stone': '#707D7D',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark-green via-rich-black to-rich-black">

    <div class="w-full max-w-sm bg-dark-green border border-pine p-6 rounded-2xl shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-bangladesh-green to-caribbean-green flex items-center justify-center shadow-lg shadow-caribbean-green/10 mx-auto mb-3">
                <i data-lucide="lock" class="w-5 h-5 text-rich-black font-bold"></i>
            </div>
            <h2 class="text-xl font-bold tracking-tight">Portail ERP Sakania</h2>
            <p class="text-stone text-xs mt-1">Veuillez vous authentifier pour accéder aux modules.</p>
        </div>

        <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-xs font-medium text-center"></div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Adresse Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone"><i data-lucide="mail" class="w-4 h-4"></i></span>
                    <input type="email" id="login-email" placeholder="admin@sakania.org" required class="w-full bg-rich-black border border-pine rounded-lg pl-10 pr-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Mot de passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone"><i data-lucide="key-round" class="w-4 h-4"></i></span>
                    <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-rich-black border border-pine rounded-lg pl-10 pr-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-caribbean-green hover:bg-mountain-meadow text-rich-black font-bold py-2.5 rounded-lg text-xs transition flex items-center justify-center gap-2 mt-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Se connecter
            </button>
        </form>

    </div>

    <script src="js/login.js" type="module"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
