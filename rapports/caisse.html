<!DOCTYPE html>
<html lang="fr" class="bg-rich-black text-anti-flash-white antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Caisse — ERP Sakania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rich-black': '#021B1A',
                        'dark-green': '#032221',
                        'bangladesh-green': '#03624C',
                        'mountain-meadow': '#2CC295',
                        'caribbean-green': '#00DF81',
                        'anti-flash-white': '#F1F7F6',
                        'pine': '#06302B',
                        'mint': '#2FA98C',
                        'stone': '#707D7D',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark-green via-rich-black to-rich-black">

    <header class="border-b border-pine bg-dark-green/40 backdrop-blur-md px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="p-2 rounded-lg bg-pine/40 hover:bg-pine border border-pine text-stone hover:text-anti-flash-white transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <div>
                <h1 class="font-bold text-sm sm:text-base tracking-tight uppercase text-caribbean-green">Module : Trésorerie & Caisse</h1>
                <p class="text-[10px] text-stone">Suivi des flux financiers et des devises (FC / $)</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-dark-green border border-pine p-5 rounded-2xl relative overflow-hidden">
                <span class="text-xs font-semibold uppercase tracking-wider text-stone block mb-1">Solde Francs Congolais</span>
                <div id="solde-fc" class="text-3xl font-black text-anti-flash-white">0 FC</div>
                <div class="absolute right-4 bottom-4 text-pine/40"><i data-lucide="wallet" class="w-12 h-12"></i></div>
            </div>
            <div class="bg-dark-green border border-pine p-5 rounded-2xl relative overflow-hidden">
                <span class="text-xs font-semibold uppercase tracking-wider text-stone block mb-1">Solde Dollars Américains</span>
                <div id="solde-usd" class="text-3xl font-black text-caribbean-green">0.00 $</div>
                <div class="absolute right-4 bottom-4 text-pine/40"><i data-lucide="banknote" class="w-12 h-12"></i></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="bg-dark-green border border-pine p-5 rounded-2xl h-fit">
                <h3 class="text-sm font-bold uppercase tracking-wider text-mountain-meadow border-b border-pine pb-2 mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Nouvel Enregistrement
                </h3>
                <form id="form-caisse" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Date</label>
                        <input type="date" id="caisse-date" required class="w-full bg-rich-black border border-pine rounded-lg px-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Flux / Type de mouvement</label>
                        <select id="caisse-flux" required class="w-full bg-rich-black border border-pine rounded-lg px-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                            <option value="Entrée">Entrée (Recette, Don...)</option>
                            <option value="Sortie">Sortie (Dépense, Transport...)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Libellé / Description</label>
                        <input type="text" id="caisse-libelle" placeholder="Ex: Achat fournitures de bureau" required class="w-full bg-rich-black border border-pine rounded-lg px-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Montant</label>
                            <input type="number" id="caisse-montant" min="1" placeholder="0" required class="w-full bg-rich-black border border-pine rounded-lg px-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-stone mb-1">Devise</label>
                            <select id="caisse-devise" required class="w-full bg-rich-black border border-pine rounded-lg px-3 py-2 text-xs text-anti-flash-white focus:outline-none focus:border-mountain-meadow transition">
                                <option value="FC">FC</option>
                                <option value="USD">$ USD</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-caribbean-green hover:bg-mountain-meadow text-rich-black font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-2 mt-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Valider l'opération
                    </button>
                </form>
            </div>

            <div class="bg-dark-green border border-pine rounded-2xl overflow-hidden lg:col-span-2 shadow-xl flex flex-col">
                <div class="p-4 bg-rich-black/30 border-b border-pine flex items-center justify-between">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-stone flex items-center gap-2">
                        <i data-lucide="list-ordered" class="w-4 h-4 text-mountain-meadow"></i> Journal des mouvements
                    </h3>
                </div>
                
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-rich-black/60 border-b border-pine text-stone font-semibold uppercase tracking-wider">
                                <th class="py-3 px-4 w-20">Date</th>
                                <th class="py-3 px-4">Libellé / Origine</th>
                                <th class="py-3 px-4 text-center">Type</th>
                                <th class="py-3 px-4 text-right">Montant</th>
                            </tr>
                        </thead>
                        <tbody id="table-caisse-body" class="divide-y divide-pine/30">
                            <tr>
                                <td colspan="4" class="py-8 text-center text-stone">
                                    Chargement des écritures comptables...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="caisse.js" type="module"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
